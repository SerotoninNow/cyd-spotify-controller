# Builds the Android app. Pushing a tag like app-v1.1 publishes a signed APK as a GitHub
# Release; pull requests that touch android/ get the APK as a downloadable artifact.
#
# Secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of ~/.config/cyd-now-playing/release.jks
#   KEYSTORE_PASSWORD  its password (also the key's)
name: Android app

on:
  push:
    tags: ["app-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: the APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=cyd\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "CYD_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then name="${GITHUB_REF#refs/tags/app-v}"; else name="0-dev"; fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$apk" "$RUNNER_TEMP/CYD-Now-Playing-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CYD-Now-Playing-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/CYD-Now-Playing-${{ env.VERSION_NAME }}.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/CYD-Now-Playing-$VERSION_NAME.apk" \
            --title "CYD Now Playing $VERSION_NAME" \
            --notes "Android app that shows what's playing on the phone on the CYD remote. On the phone, tap the APK below to install; see the README for granting notification access."
