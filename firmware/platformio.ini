; ESP32-2432S028 ("Cheap Yellow Display") as a Spotify now-playing screen.
;
;   pio run -t upload              -> standard board (ILI9341, one micro-USB port)
;   pio run -e cyd2usb -t upload   -> "2 USB" variant (ST7789, micro-USB + USB-C)
;   pio run -e standalone -t upload  -> Wi-Fi remote that needs no PC (add 2usb for that variant)
;   pio run -e remote -t upload      -> Bluetooth media remote; song details need the Android app

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 2000000
build_src_filter = +<main.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.4.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Must match --baud on the Pi side.
    -DLINK_BAUD=2000000
    ; TFT_eSPI is configured here instead of editing its User_Setup.h.
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1


; Standalone: the CYD talks to Spotify over Wi-Fi by itself; USB only powers it.
; Set it up with: python3 cyd_spotify.py --setup-standalone
[standalone]
build_src_filter = +<standalone.cpp>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
standalone_flags =
    -DLOAD_GFXFF=1
    -DSETUP_BAUD=115200
board_build.partitions = min_spiffs.csv

[env:standalone]
build_src_filter = ${standalone.build_src_filter}
lib_deps = ${standalone.lib_deps}
board_build.partitions = ${standalone.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd.build_flags}
    ${standalone.standalone_flags}

[env:standalone2usb]
build_src_filter = ${standalone.build_src_filter}
lib_deps = ${standalone.lib_deps}
board_build.partitions = ${standalone.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd2usb.build_flags}
    ${standalone.standalone_flags}


; Arduino core 3 (ESP-IDF 5) via pioarduino, the first with the BLE stack the remote needs.
[arduino3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
common_flags =
    -DLOAD_GFXFF=1
    -DSETUP_BAUD=115200

; Remote: a Bluetooth LE media remote (previous, play/pause, next, volume). The phone keeps
; playing through its own speaker or headphones. The Android app in android/ adds the song
; details and cover over the same connection.
[remote]
build_src_filter = +<remote.cpp>
; Two app slots, so the app can send an update over Bluetooth while this one keeps running.
; Changing the layout takes one more flash over USB.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:fw_info.py
; Tells the app which firmware this is, so it doesn't swap one flavor for another unasked.
custom_fw_flavor = public

[env:remote]
platform = ${arduino3.platform}
build_src_filter = ${remote.build_src_filter}
board_build.partitions = ${remote.board_build.partitions}
extra_scripts = ${remote.extra_scripts}
custom_fw_flavor = ${remote.custom_fw_flavor}
custom_fw_board = cyd
monitor_speed = 115200
build_flags =
    ${env:cyd.build_flags}
    ${arduino3.common_flags}

[env:remote2usb]
platform = ${arduino3.platform}
build_src_filter = ${remote.build_src_filter}
board_build.partitions = ${remote.board_build.partitions}
extra_scripts = ${remote.extra_scripts}
custom_fw_flavor = ${remote.custom_fw_flavor}
custom_fw_board = cyd2usb
monitor_speed = 115200
build_flags =
    ${env:cyd2usb.build_flags}
    ${arduino3.common_flags}
