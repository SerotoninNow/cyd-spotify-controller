; ESP32-2432S028 ("Cheap Yellow Display") as a Spotify now-playing screen.
;
;   pio run -t upload              -> standard board (ILI9341, one micro-USB port)
;   pio run -e cyd2usb -t upload   -> "2 USB" variant (ST7789, micro-USB + USB-C)
;   pio run -e standalone -t upload  -> Wi-Fi remote that needs no PC (add 2usb for that variant)
;   pio run -e bluetooth -t upload   -> Bluetooth speaker + screen, no Wi-Fi or PC (add 2usb too)
;   pio run -e bluetooth-i2s -t upload -> the same, sound through an I2S DAC board

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 2000000
build_src_filter = +<main.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.4.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Must match --baud on the Pi side.
    -DLINK_BAUD=2000000
    ; TFT_eSPI is configured here instead of editing its User_Setup.h.
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1


; Standalone: the CYD talks to Spotify over Wi-Fi by itself; USB only powers it.
; Set it up with: python3 cyd_spotify.py --setup-standalone
[standalone]
build_src_filter = +<standalone.cpp>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0
standalone_flags =
    -DLOAD_GFXFF=1
    -DSETUP_BAUD=115200
board_build.partitions = min_spiffs.csv

[env:standalone]
build_src_filter = ${standalone.build_src_filter}
lib_deps = ${standalone.lib_deps}
board_build.partitions = ${standalone.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd.build_flags}
    ${standalone.standalone_flags}

[env:standalone2usb]
build_src_filter = ${standalone.build_src_filter}
lib_deps = ${standalone.lib_deps}
board_build.partitions = ${standalone.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd2usb.build_flags}
    ${standalone.standalone_flags}


; Bluetooth: a phone pairs with the CYD like a speaker; no Wi-Fi and no computer.
; Needs Arduino core 3 (ESP-IDF 5), the first with Bluetooth album art (AVRCP cover art).
[bluetooth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
build_src_filter = +<bluetooth.cpp>
bluetooth_flags =
    -DLOAD_GFXFF=1
    -DSETUP_BAUD=115200
; The Bluetooth stack alone is over 1 MB.
board_build.partitions = huge_app.csv

[env:bluetooth]
platform = ${bluetooth.platform}
build_src_filter = ${bluetooth.build_src_filter}
board_build.partitions = ${bluetooth.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd.build_flags}
    ${bluetooth.bluetooth_flags}

[env:bluetooth2usb]
platform = ${bluetooth.platform}
build_src_filter = ${bluetooth.build_src_filter}
board_build.partitions = ${bluetooth.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd2usb.build_flags}
    ${bluetooth.bluetooth_flags}

; The same, with the sound going to an I2S DAC board (PCM5102...) instead of the speaker
; socket: BCK -> GPIO27 and WS (LCK) -> GPIO22 on CN1, DIN -> TX (GPIO1) on P1.
; Other pins: add -DI2S_BCK=, -DI2S_WS=, -DI2S_DOUT=.
[env:bluetooth-i2s]
platform = ${bluetooth.platform}
build_src_filter = ${bluetooth.build_src_filter}
board_build.partitions = ${bluetooth.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd.build_flags}
    ${bluetooth.bluetooth_flags}
    -DAUDIO_I2S=1

[env:bluetooth-i2s-2usb]
platform = ${bluetooth.platform}
build_src_filter = ${bluetooth.build_src_filter}
board_build.partitions = ${bluetooth.board_build.partitions}
monitor_speed = 115200
build_flags =
    ${env:cyd2usb.build_flags}
    ${bluetooth.bluetooth_flags}
    -DAUDIO_I2S=1
